name: StockSim Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ================= JOB 1: LINT & TEST =================
  test:
    name: Test & Validate Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./server

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./client

      - name: Build Frontend Assets (Vite)
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: /api

  # ================= JOB 2: DOCKER BUILD VALIDATION =================
  docker-build:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: stocksim-server:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: stocksim-client:latest

  # ================= JOB 3: AUTO-DEPLOY TO CLOUD VM =================
  # Runs ONLY on push to main (not on pull requests).
  # SSHs into your Cloud VM and pulls + rebuilds the latest code.
  # Required GitHub Secrets: VM_HOST, VM_USER, VM_SSH_KEY
  deploy:
    name: Deploy to Production Server
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VM_HOST != ''

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/stocksim-pro
            git pull origin main
            docker compose up --build -d
            docker image prune -f
            echo "Deployment complete at $(date)"

