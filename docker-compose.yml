version: '3.8'

services:
  # ================= MONGODB DATABASE =================
  mongo:
    image: mongo:7.0
    container_name: stocksim-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - stocksim-network

  # ================= BACKEND API SERVER =================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stocksim-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/stocksim-pro}
      - JWT_SECRET=${JWT_SECRET:-dev_stocksim_secret_key_1234567890}
      - JWT_EXPIRES_IN=7d
      - QUOTE_CACHE_TTL_SECONDS=60
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://stocksimpro.in,https://stocksimpro.in}
      - TRUST_PROXY_HOPS=1
    depends_on:
      - mongo
    networks:
      - stocksim-network

  # ================= FRONTEND CLIENT =================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-77922463370-v6c47s8dfd2bdcaek49smmlnv1l4m212.apps.googleusercontent.com}
    container_name: stocksim-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - stocksim-network

volumes:
  mongo-data:
    driver: local

networks:
  stocksim-network:
    driver: bridge
